[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stocker-metrics"
version = "0.1.0"
description = "Tiny reusable package to emit custom metrics to a StatsD exporter"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/stocker_metrics"]
